name: CI

on:
  push:
  pull_request:

jobs:
  # Types, lint rules, unit and snapshot tests, the package build.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Layout and pixel tests in Chromium, on Linux.
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-test-results
          path: test-results/

  # The same tests in WebKit on macOS: Safari's engine with Safari's form controls (Linux WebKit
  # draws selects and the textarea grip differently, so the base tests would not test Safari).
  webkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install webkit
      - run: npx playwright test --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-test-results
          path: test-results/
