<main class="page">
  <section class="row">
    <div class="box sharp-1" id="sharp-1">1px square</div>
    <div class="box sharp-2" id="sharp-2">2px square</div>
    <div class="box sharp-4" id="sharp-4">4px square</div>
    <div class="box round-1" id="round-1">1px rounded</div>
    <div class="box round-2" id="round-2">2px rounded</div>
    <div class="box round-4" id="round-4">4px rounded</div>
  </section>

  <section class="row">
    <span class="chip" id="chip">Chip</span>
    <button class="btn" id="btn" type="button">Hover button</button>
    <div class="twice override" id="twice">Border from two rules</div>
    <div class="important" id="important">!important</div>
  </section>

  <article class="wide" id="wide"><h3>Wide card</h3><p>A long, wide card. The middle of the 9-slice stretches all the way, so the line must not break.</p></article>

  <div class="responsive" id="responsive">Border inside @media</div>
</main>
