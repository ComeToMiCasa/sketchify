<main class="page">
  <section class="row" aria-label="Button sizes and colours">
    <button class="btn" id="btn" type="button">Default</button>
    <button class="btn btn--sm" id="btn-sm" type="button">Small</button>
    <button class="btn btn--lg" id="btn-lg" type="button">Large</button>
    <button class="btn btn--primary" id="btn-primary" type="button">Primary</button>
    <button class="btn btn--danger" id="btn-danger" type="button">Danger</button>
  </section>

  <section class="row" aria-label="Button combinations">
    <button class="btn btn--sm btn--primary" id="btn-sm-primary" type="button">Small primary</button>
    <button class="btn btn--sm btn--danger" id="btn-sm-danger" type="button">Small danger</button>
    <button class="btn btn--lg btn--primary" id="btn-lg-primary" type="button">Large primary</button>
    <button class="btn btn--lg btn--danger" id="btn-lg-danger" type="button">Large danger</button>
  </section>

  <section class="row" aria-label="Cards">
    <article class="card" id="card">Default card</article>
    <article class="card card--flat" id="card-flat">Square card</article>
    <article class="card is-selected" id="card-selected">Selected card</article>
    <article class="card card--flat is-selected" id="card-flat-selected">Square, selected</article>
  </section>

  <section class="row" aria-label="Inputs">
    <input class="field" id="field" type="text" value="Default input">
    <input class="field is-invalid" id="field-invalid" type="text" value="Invalid input">
  </section>
</main>
