<main class="page">
  <section class="row" aria-label="버튼 크기와 색">
    <button class="btn" id="btn" type="button">기본</button>
    <button class="btn btn--sm" id="btn-sm" type="button">작게</button>
    <button class="btn btn--lg" id="btn-lg" type="button">크게</button>
    <button class="btn btn--primary" id="btn-primary" type="button">주요</button>
    <button class="btn btn--danger" id="btn-danger" type="button">위험</button>
  </section>

  <section class="row" aria-label="버튼 조합">
    <button class="btn btn--sm btn--primary" id="btn-sm-primary" type="button">작게·주요</button>
    <button class="btn btn--sm btn--danger" id="btn-sm-danger" type="button">작게·위험</button>
    <button class="btn btn--lg btn--primary" id="btn-lg-primary" type="button">크게·주요</button>
    <button class="btn btn--lg btn--danger" id="btn-lg-danger" type="button">크게·위험</button>
  </section>

  <section class="row" aria-label="카드">
    <article class="card" id="card">기본 카드</article>
    <article class="card card--flat" id="card-flat">각진 카드</article>
    <article class="card is-selected" id="card-selected">선택된 카드</article>
    <article class="card card--flat is-selected" id="card-flat-selected">각진·선택</article>
  </section>

  <section class="row" aria-label="입력">
    <input class="field" id="field" type="text" value="기본 입력">
    <input class="field is-invalid" id="field-invalid" type="text" value="잘못된 입력">
  </section>
</main>
