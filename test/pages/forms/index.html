<main class="page">
  <form class="form">
    <label class="field-row">Name <input class="field" type="text" value="Jane Doe"></label>
    <label class="field-row">Note <textarea class="field" rows="3">Several lines of input</textarea></label>
    <label class="field-row">Kind
      <select class="field"><option>One</option><option>Two</option></select>
    </label>
    <div class="choices">
      <label><input class="check" type="checkbox" checked> Checked</label>
      <label><input class="check" type="checkbox"> Unchecked</label>
      <label><input class="radio" type="radio" name="r" checked> Radio 1</label>
      <label><input class="radio" type="radio" name="r"> Radio 2</label>
    </div>
  </form>
</main>
