<main class="page">
  <label>Name <input id="text" type="text" value="Jane Doe"></label>
  <label>Email <input id="email" type="email" placeholder="me@example.com"></label>
  <textarea id="memo" rows="3">Several lines of input</textarea>
  <select id="pick"><option>One</option><option>Two</option></select>
  <div>
    <label><input id="check1" type="checkbox" checked> Checked</label>
    <label><input id="check2" type="checkbox"> Unchecked</label>
    <label><input id="check3" type="checkbox"> One more</label>
  </div>
  <div>
    <label><input id="radio1" type="radio" name="r" checked> Radio 1</label>
    <label><input id="radio2" type="radio" name="r"> Radio 2</label>
  </div>
  <div><hr id="rule"></div>
  <p class="links">Links: <a id="link" href="#a">A default link</a>, <a id="link-long" href="#b">a default link text written long enough to wrap over several lines, really quite long indeed</a>, <a id="link-plain" class="plain-link" href="#c">no underline</a>, <a id="link-dotted" class="dotted-link" href="#d">dotted link</a>.</p>
  <div><button id="btn" type="button">Button</button> <input id="submit" type="submit" value="Send"></div>
  <input id="own" class="own" type="text" value="Page style wins">
</main>
