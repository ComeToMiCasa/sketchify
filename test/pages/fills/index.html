<main class="page">
  <section class="row">
    <button class="btn" id="btn1" type="button">Rough fill</button>
    <button class="btn" id="btn2" type="button">Neighbour</button>
    <button class="btn flat" id="btn-flat" type="button">Original fill</button>
  </section>

  <section class="row">
    <div class="block" id="block1"></div>
    <div class="block" id="block2"></div>
    <div class="block framed" id="block-framed"></div>
  </section>

  <div class="track"><div class="bar" id="bar"></div></div>

  <p>A sentence with <span class="hl" id="hl">text highlighted with a marker</span> in it.</p>

  <div class="note" id="note">A note with a marker and a border</div>

  <div class="image" id="image"></div>
</main>
